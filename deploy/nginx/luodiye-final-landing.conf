# nginx 站点:真落地页(luodiye_video 静态产物)
#
# 适用域:所有 finalLandings 池里的域,以及它们的泛子域
# 路径约定:
#   静态文件: /opt/sites/luodiye_video/out/   (next build 产物)
#   admin 反代:/api/portal/landing/config 走到 admin-server
#
# 复制本文件到 /etc/nginx/sites-available/,做必要修改后启用:
#   sudo cp /opt/tyjx-landing/deploy/nginx/luodiye-final-landing.conf \
#           /etc/nginx/sites-available/luodiye-final-landing
#   sudo ln -sf /etc/nginx/sites-available/luodiye-final-landing /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 添加新 finalLanding 域时:在 server_name 行追加 "FOO.cc *.FOO.cc",
# 并把 ssl_certificate / ssl_certificate_key 切换到对应证书(或多 server 段)。

# ── HTTP → HTTPS 跳转 ─────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name
    tyjxhotpzixm.cc *.tyjxhotpzixm.cc
    tyjx7k2m9pqs4.cc *.tyjx7k2m9pqs4.cc
    tyjxlh2wyxr9.cc *.tyjxlh2wyxr9.cc;
  return 301 https://$host$request_uri;
}

# ── HTTPS 主站点 ─────────────────────────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  server_name
    tyjxhotpzixm.cc *.tyjxhotpzixm.cc
    tyjx7k2m9pqs4.cc *.tyjx7k2m9pqs4.cc
    tyjxlh2wyxr9.cc *.tyjxlh2wyxr9.cc;

  # === 证书(每个根域单独 acme.sh 签发,wildcard) ===
  # 这里以单证书示意。多域可拆成多 server 段或用 SNI 加多 ssl_certificate。
  ssl_certificate     /etc/nginx/ssl/tyjxhotpzixm.cc.crt;
  ssl_certificate_key /etc/nginx/ssl/tyjxhotpzixm.cc.key;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # === 安全/性能头 ===
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  # === gzip ===
  gzip on;
  gzip_min_length 1k;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_vary on;

  # === 静态根 ===
  root  /opt/sites/luodiye_video/out;
  index index.html;

  # === 反代 admin 公开 API(/api/portal/*) ===
  # 注意:必须严格只反代 /api/portal/,不要泄露 /api/admin/
  location ~ ^/api/portal/ {
    proxy_pass         http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_read_timeout 30s;
  }

  # === 上传文件(图片/视频)直接走 admin 静态 ===
  # luodiye 配置里写的是 /uploads/xxx.png,所以从落地页域同源就能拉到
  location ~ ^/uploads/ {
    proxy_pass         http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_cache_valid  200 7d;
    add_header         Cache-Control "public, max-age=604800";
  }

  # === 静态资源:长 cache ===
  location ~* \.(?:css|js|woff2?|ttf|eot)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  location ~* \.(?:png|jpe?g|gif|webp|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  location ~* \.(?:mp4|webm|mov)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  # === fallback ===
  location / {
    try_files $uri $uri/ $uri.html /index.html;
  }
}
