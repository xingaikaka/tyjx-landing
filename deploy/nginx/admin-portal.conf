# nginx 站点:admin 后台(admin-portal-web 静态 + admin-portal-server 反代)
#
# 适用域:你给"对外系统 admin"准备的一个内部 / 受限访问域
#         例:admin.tyjx-internal.example
#
# 安全要点:
#   1. 强烈建议用 IP allowlist 限制访问(allow / deny)
#   2. /api/admin/ 必须只通过这里走,不能从 luodiye-final-landing.conf 暴露
#   3. 给 /api/admin/login 配限速,防暴力

# ── HTTP → HTTPS ─────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name admin.tyjx-internal.example;
  return 301 https://$host$request_uri;
}

# ── HTTPS ────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;

  server_name admin.tyjx-internal.example;

  ssl_certificate     /etc/nginx/ssl/admin.tyjx-internal.example.crt;
  ssl_certificate_key /etc/nginx/ssl/admin.tyjx-internal.example.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # === 访问控制:取消注释并改成你的运维 IP ===
  # allow 1.2.3.4;
  # allow 5.6.7.0/24;
  # deny all;

  # 静态(admin-web 构建产物)
  root  /opt/sites/admin-portal-web/dist;
  index index.html;

  # 上传文件
  location ~ ^/uploads/ {
    proxy_pass         http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_buffering    off;
    proxy_read_timeout 60s;
    client_max_body_size 50m;
  }

  # 管理 API:登录接口限速
  location = /api/admin/login {
    limit_req       zone=admin_login burst=5 nodelay;
    proxy_pass         http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # 其余管理 API + 公开 API 全部反代
  location ~ ^/api/ {
    proxy_pass         http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_read_timeout 60s;
    client_max_body_size 50m;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
