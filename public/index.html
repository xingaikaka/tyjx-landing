<!DOCTYPE html>
<html lang="zh" style="font-size:37.5px">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#16151B">
  <meta name="format-detection" content="telephone=no">
  <meta name="format-detection" content="email=no">
  <link rel="icon" type="image/x-icon" href="/assets/imgs/91.ico">
  <title>天涯精选 - 地址发布页</title>
  <style>
    *,*:after,*:before{margin:0;padding:0;outline:none;-webkit-box-sizing:border-box;-moz-box-sizing:border-box;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    ol,ul{list-style:none}
    ins,a{text-decoration:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;color:var(--text-color)}
    table{border-collapse:collapse;border-spacing:0}
    img{border:none;vertical-align:middle}
    body,html{font-size:0.37333rem;height:100%;font-family:PingFang SC,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;overscroll-behavior:none}
    body{display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;height:100%;background-color:var(--bg-color);color:var(--text-color);overflow:hidden;filter:progid:DXImageTransform.Microsoft.gradient(GradientType=0, startColorstr="#0f0b19", endColorstr="var(--bg-color)");background:-webkit-linear-gradient(-135deg,#0f0b19,var(--bg-color));background:-moz-linear-gradient(-135deg,#0f0b19,var(--bg-color));background:-o-linear-gradient(-135deg,#0f0b19,var(--bg-color));background:linear-gradient(-135deg,#0f0b19,var(--bg-color));padding-bottom:env(safe-area-inset-bottom,0)}
    :root{--bg-color:#16151B;--text-color:#8F8F8F;--white-color:#fff;--black-color:#000;--menu-icon-color:#A7B0BB;--color-primary:#f70;--icon-box-color:#26252B;--warn-color:#FFA538;--icon-radius:0.18667rem;--box-radius:0.26667rem;--grid-gap:0.21333rem}
    .page::-webkit-scrollbar{display:none}
    .page{height:100%;width:100%;max-width:11.41333rem;margin:0 auto;padding:0.53333rem;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;-ms-flex-direction:column;flex-direction:column;-webkit-box-align:center;-webkit-align-items:center;-ms-flex-align:center;align-items:center;-webkit-box-pack:center;-webkit-justify-content:center;-ms-flex-pack:center;justify-content:center;padding-left:max(0.53333rem,env(safe-area-inset-left,0));padding-right:max(0.53333rem,env(safe-area-inset-right,0));visibility:hidden}
    .page.ready{visibility:visible}
    .nav-a{position:relative;border-radius:0.32rem;-webkit-border-radius:0.32rem;-moz-border-radius:0.32rem;padding:1.33333rem 0.26667rem 0.26667rem 0.26667rem;margin-top:0.8rem;background-color:rgba(255,255,255,0.05);border:0.02667rem solid rgba(255,255,255,0.1);width:100%}
    .nav-a .va-a{position:absolute;top:-0.8rem;left:calc((100% - 1.70667rem)/2);width:1.70667rem;height:1.70667rem}
    .nav-a .va-a img{width:100%;height:100%}
    .nav-a .va-b{font-size:0.64rem;color:#fff;font-weight:800;text-align:center}
    .nav-a .va-c{padding:0.13333rem 0;text-align:center}
    .nav-a .va-d{font-weight:600;color:#fff;text-align:center}
    .nav-a .va-e,.nav-a .va-g{margin:0.8rem 0;display:grid;grid-template-columns:1fr;gap:0.26667rem}
    .nav-a .va-e a,.nav-a .va-g a{background-color:rgba(255,255,255,0.05);border:0.02667rem solid rgba(255,255,255,0.1);color:var(--color-primary);padding:0 0.26667rem;height:1.06667rem;line-height:1.06667rem;border-radius:10.66667rem;-webkit-border-radius:10.66667rem;-moz-border-radius:10.66667rem;text-align:center;cursor:pointer;font-weight:500}
    .nav-a .va-e a{font-size:0.34667rem}
    .nav-a .va-g a{font-size:0.34667rem;padding:0 0.05333rem 0 0.26667rem;display:-webkit-box;display:-webkit-flex;display:-ms-flexbox;display:flex;-webkit-box-pack:justify;-ms-flex-pack:justify;-webkit-justify-content:space-between;justify-content:space-between;-webkit-box-align:center;-webkit-align-items:center;-ms-flex-align:center;align-items:center;color:#fff}
    .nav-a .va-g a .domain-text{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;height:auto;line-height:1.06667rem;border-radius:0;padding:0;background:transparent;font-size:0.34667rem;color:#fff}
    .nav-a .va-g a .copy-btn{flex-shrink:0;height:0.96rem;line-height:0.96rem;border-radius:0.96rem;-webkit-border-radius:0.96rem;-moz-border-radius:0.96rem;padding:0 0.26667rem;text-align:center;background-color:var(--color-primary);color:#fff;font-size:0.32rem}
    .nav-a .va-f{text-align:center}
    .nav-a .va-f span{display:block;margin-bottom:0.26667rem}
    .nav-a .va-f span b{color:var(--color-primary)}
    .nav-a .va-f p{margin-top:0.26667rem;padding:0.10667rem 0.26667rem;border-radius:2.66667rem;-webkit-border-radius:2.66667rem;-moz-border-radius:2.66667rem}
    .nav-a .va-h{color:var(--color-primary);text-align:center;padding:0.26667rem}
    .nav-b{margin-top:0.53333rem;background-color:rgba(255,255,255,0.05);border:0.02667rem solid rgba(255,255,255,0.1);border-radius:0.32rem;-webkit-border-radius:0.32rem;-moz-border-radius:0.32rem;text-align:center;padding:0.4rem;width:100%}
    .toast{position:fixed;bottom:calc(1.2rem + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:0.4rem 0.8rem;border-radius:0.26667rem;font-size:0.34667rem;opacity:0;z-index:9999;max-width:90vw}
    .toast.show{opacity:1}
  </style>
</head>
<body>
  <div class="page">
    <div class="nav-a">
      <div class="va-a"><img src="/assets/imgs/91.png" alt="logo" /></div>
      <div class="va-b">地址发布页</div>
      <div class="va-c">请 Ctrl+D 收藏本页到浏览器收藏夹回家不迷路</div>
      <div class="va-d">--点击下方按钮进入网站--</div>
      <div class="va-e" id="step1-btns" style="display:none"></div>
      <div class="va-g" id="step2-area" style="display:none">
        <a href="javascript:;" target="_blank"><span class="domain-text">努力加载中...</span><span class="copy-btn">复制网址</span></a>
        <a href="javascript:;" target="_blank"><span class="domain-text">努力加载中...</span><span class="copy-btn">复制网址</span></a>
      </div>
      <div class="va-h" id="step2-hint" style="display:none">点击上方按钮可直接进入，或复制网址在浏览器打开</div>
      <div class="va-f" id="va-f-address">
        <span>收藏本站永久地址：<b id="entry-primary">-</b>，备用地址：<b id="entry-backup">-</b>，防止失联！</span>
        <p>网站域名经常更新，防止网站打不开</p>
        <p>请务必收藏此网页，永久有效！</p>
      </div>
    </div>
    <div class="nav-b">
      安卓用户请使用谷歌(Chrome)浏览器访问<br>
      iPhone用户请使用手机自带Safari浏览器访问<br>
      无广告、体验流畅、速度更快
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <script src="/assets/js/crypto-util.js"></script>
  <script>
    (function(doc,win){
      var docEl=doc.documentElement;
      var recalc=function(){
        var clientWidth=docEl.clientWidth;
        if(!clientWidth)return;
        if(clientWidth>428)clientWidth=428;
        docEl.style.fontSize=clientWidth/10+'px';
      };
      recalc();
      win.addEventListener('resize',recalc,false);
      win.addEventListener('orientationchange',recalc,false);
      doc.addEventListener('DOMContentLoaded',recalc,false);
    })(document,window);
  </script>
  <script>
    const API_SECRET = 'ipu2s74rbl9odlleyt4aywm7sq2fxds2';

    function getDomainParam() {
      const urlParams = new URLSearchParams(window.location.search);
      let domain = urlParams.get('domain') || window.location.hostname;
      return domain.split('.').slice(-2).join('.');
    }

    function randomSubdomain(len) {
      len = len || 15;
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      let s = '';
      for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return s;
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2000);
    }

    (function () {
      const step1Btns = document.getElementById('step1-btns');
      const step2Area = document.getElementById('step2-area');
      const step2Hint = document.getElementById('step2-hint');
      const pageEl = document.querySelector('.page');
      const baseDomain = getDomainParam();

      function markPageReady() {
        if (pageEl) pageEl.classList.add('ready');
      }

      function showStep2(domainIndex) {
        step1Btns.style.display = 'none';
        step2Area.style.display = 'grid';
        step2Hint.style.display = 'block';

        const params = { Domain: baseDomain, domainIndex: domainIndex };
        const encrypted = cryptoUtil.encrypt(JSON.stringify(params), API_SECRET);
        const apiUrl = `${location.protocol}//${location.host}/Web/GetJumpURL2`;

        fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: encrypted,
        })
          .then((res) => {
            if (!res.ok) throw new Error('API error');
            return res.text();
          })
          .then((text) => {
            const decrypted = cryptoUtil.decrypt(text, API_SECRET);
            const json = JSON.parse(decrypted);
            if (json.code !== 0 || !json.data?.jumpDomains) throw new Error('Invalid response');
            const urls = String(json.data.jumpDomains).split(',').map((d) => (d || '').trim()).filter(Boolean);
            const items = document.querySelectorAll('.va-g a');
            items.forEach((item, i) => {
              const url = urls[i] || '';
              const el = item.querySelector('.domain-text');
              const displayUrl = url ? (url.startsWith('http') ? url : 'https://' + url) : '';
              if (el) el.textContent = url || '获取失败';
              item.href = displayUrl || 'javascript:;';
            });
            initCopy(items);
            markPageReady();
          })
          .catch(() => {
            const items = document.querySelectorAll('.va-g a');
            document.querySelectorAll('.domain-text').forEach((el) => (el.textContent = '获取失败'));
            initCopy(items);
            markPageReady();
          });
      }

      function loadStep1() {
        fetch(`${location.protocol}//${location.host}/Web/GetDomainList`)
          .then((res) => (res.ok ? res.json() : Promise.reject(new Error('API error'))))
          .then((json) => {
            const data = json.data || {};
            const domains = data.domains || [];
            const fallback = data.fallbackDomain || '';
            updateEntryDomains(data.entryDomains);
            if (domains.length > 0) {
              step1Btns.innerHTML = domains
                .map((d, i) => {
                  const url = 'https://' + randomSubdomain() + '.' + d + '/';
                  return '<a href="' + url + '">最新地址' + (i + 1) + '</a>';
                })
                .join('');
            } else if (fallback) {
              step1Btns.innerHTML = '<a href="https://' + randomSubdomain() + '.' + fallback + '/">最新地址1</a>';
            } else {
              step1Btns.innerHTML = '<a href="javascript:;">获取失败，请刷新重试</a>';
            }
            step1Btns.style.display = 'grid';
            markPageReady();
          })
          .catch(() => {
            step1Btns.innerHTML = '<a href="javascript:;">获取失败，请刷新重试</a>';
            step1Btns.style.display = 'grid';
            markPageReady();
          });
      }

      function updateEntryDomains(entryDomains) {
        const arr = Array.isArray(entryDomains) ? entryDomains : [];
        const primary = document.getElementById('entry-primary');
        const backup = document.getElementById('entry-backup');
        if (primary) primary.textContent = arr[0] || '-';
        if (backup) backup.textContent = arr[1] || '-';
      }

      fetch(`${location.protocol}//${location.host}/Web/GetDomainList`)
        .then((res) => (res.ok ? res.json() : Promise.reject(new Error('API error'))))
        .then((json) => {
          const data = json.data || {};
          const domains = data.domains || [];
          updateEntryDomains(data.entryDomains);
          const domainIndex = domains.indexOf(baseDomain);

          if (domainIndex >= 0) {
            step2Area.style.display = 'none';
            step2Hint.style.display = 'none';
            showStep2(domainIndex);
          } else {
            step2Area.style.display = 'none';
            step2Hint.style.display = 'none';
            loadStep1();
          }
        })
        .catch(() => {
          step2Area.style.display = 'none';
          step2Hint.style.display = 'none';
          loadStep1();
        });
    })();

    function initCopy(items) {
      items.forEach((item) => {
        const copyBtn = item.querySelector('.copy-btn');
        const domainEl = item.querySelector('.domain-text');
        copyBtn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          const text = domainEl.textContent.trim();
          if (text === '获取失败' || text === '努力加载中...') return;
          const url = text.startsWith('http') ? text : 'https://' + text;
          navigator.clipboard.writeText(url).then(
            () => showToast('复制成功！'),
            () => showToast('复制失败，请手动复制')
          );
        };
      });
    }
  </script>
</body>
</html>
